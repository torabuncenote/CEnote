name: Validate

# index.html は単一ファイル構成のため、構文エラーが1つでも入るとアプリ全体が
# 起動しなくなる。プッシュ／プルリクエストのたびに最低限の妥当性を自動チェックする。
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run lightweight validation
        run: node .github/scripts/validate.mjs
      - name: 災害モードの操作ログの試験
        run: node .github/scripts/oplog-test.mjs
      - name: 申し送りの自動繰越の試験
        run: node .github/scripts/memo-carry-test.mjs
      - name: 患者情報の判定の試験
        run: node .github/scripts/phi-test.mjs
      - name: Firebaseルールと書き込み判定の安全チェック
        run: node .github/scripts/security-check.mjs
